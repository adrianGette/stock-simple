# Web en Netlify. La API corre en Render (ver render.yaml).
[build]
  command = "npm run build -w @stock/web"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# La web llama a /api en su mismo origen y Netlify lo reenvía a la API:
# la cookie de sesión queda first-party (ver docs/adr/0004).
# Reemplazá la URL por la de tu servicio en Render.
# signed: Netlify firma cada pedido con el secreto de la variable PROXY_SIGNATURE_SECRET (encabezado
# x-nf-sign) y la API rechaza los que no vienen firmados. Así nadie le pega directo a Render salteando
# el proxy (ver SECURITY.md y docs/DEPLOY.md).
[[redirects]]
  from = "/api/*"
  to = "https://stock-simple-api.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "PROXY_SIGNATURE_SECRET"

# SPA: cualquier otra ruta la resuelve React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad de la web (la API tiene las suyas con Helmet).
# - CSP: solo se ejecuta código propio. El hash autoriza el único script en línea de index.html
#   (aplica el tema antes de pintar); un test verifica que coincida si alguien lo edita.
# - frame-ancestors: solo este sitio y el portafolio pueden mostrar la app en un iframe
#   (evita clickjacking; el portafolio la muestra como vista previa).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-fSUla1Jdi2wAuD1gZVvk5hITpssek6imbfnwpJCrUVg='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self' https://adrian-gette-portfolio.netlify.app; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
