services:
  db:
    image: postgres:17-alpine
    container_name: stock-simple-db
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock_simple
    ports:
      # Solo accesible desde esta computadora, no desde la red local.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_simple"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
