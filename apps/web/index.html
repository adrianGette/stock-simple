<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Stock Simple: ventas, stock, precios y reportes en un solo lugar." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Stock Simple</title>
    <script>
      // Aplica el tema y la paleta elegidos antes del primer pintado para evitar un parpadeo.
      try {
        const scheme = localStorage.getItem('color-scheme')
        if (scheme === 'light' || scheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = scheme
          document.documentElement.dataset.theme = scheme
        }
        const palette = localStorage.getItem('color-palette')
        if (palette === 'ocean' || palette === 'graphite') document.documentElement.dataset.palette = palette
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
