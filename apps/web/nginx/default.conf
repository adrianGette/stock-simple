# nginx para la web en Docker: sirve el build de React y reenvía /api a la API,
# igual que Netlify en producción (misma URL para todo → cookie de sesión first-party).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off; # no anunciar la versión de nginx

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API: "api" es el nombre del servicio en docker-compose.yml (Docker lo resuelve solo).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier otra ruta la resuelve React Router.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
