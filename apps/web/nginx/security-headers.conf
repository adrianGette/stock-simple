# Mismas cabeceras de seguridad que netlify.toml (un test verifica que la CSP coincida).
# Se incluye en cada location: en nginx, un location con add_header propio deja de heredar
# los del server, y las cabeceras de seguridad se perderían sin aviso.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-fSUla1Jdi2wAuD1gZVvk5hITpssek6imbfnwpJCrUVg='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self' https://adrian-gette-portfolio.netlify.app; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
